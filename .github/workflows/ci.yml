# SPDX-License-Identifier: LGPL-2.1-or-later
# Agent Link's own tests, installed with Agent Link for OrcaSlicer only (no
# ScanRuler for FreeCAD, no Collab: a hidden dependency fails here straight away), on the newest
# FreeCAD conda-forge has (1.1.x, what the Mac runs) and the newest 1.0, with PrusaSlicer and
# the latest OrcaSlicer for the slicing tests. The coverage audit runs in
# ScanRuler's CI; the bake-off that gates the Claude extension's pins is
# bakeoff.yml here, and a push that only touches packaging/ (a pin bump, the
# extension's launcher) runs that, not this.
name: Agent Link tests

on:
  push:
    branches: [main, 'test-*']
    paths-ignore:
      - 'packaging/**'
      - '.github/workflows/bakeoff.yml'
      - '.github/workflows/mcpb-release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        series: ['newest', '1.0']
    name: freecad-${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        # Agent Link for OrcaSlicer, the orca tools' own add-on, beside it.
        with:
          repository: jamesK1000011/AgentLink-OrcaSlicer
          path: orcalink-addon
      - uses: actions/checkout@v5
        # Workshop for FreeCAD (one add-on since its combine: workshop/ and its
        # parts' packages at the top, SafetyNet among them): the tests that make
        # a part to work on (gen_part, gen_make), part_spec, the wall map,
        # mass_properties and the board enclosures use it.
        with:
          repository: jamesK1000011/Workshop-FreeCAD
          path: workshop-addons
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc-${{ matrix.series }}
          create-args: >-
            -c conda-forge
            ${{ matrix.series == 'newest' && 'freecad' || format('freecad={0}', matrix.series) }}
            python=3.11
            calculix
            gmsh
            numpy
          cache-environment: true
      - name: FreeCAD imports
        run: |
          echo "FREECAD_LIB=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/workshop-addons:$GITHUB_WORKSPACE/orcalink-addon" >> "$GITHUB_ENV"
          echo "AGENTLINK_ORCALINK=$GITHUB_WORKSPACE/orcalink-addon" >> "$GITHUB_ENV"
          python -c "import sys; sys.path.append('$CONDA_PREFIX/lib'); import FreeCAD, Part, MeshPart; print('FreeCAD', FreeCAD.Version()[:3])"
      - name: PrusaSlicer and a virtual screen
        timeout-minutes: 6
        continue-on-error: true
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq --no-install-recommends prusa-slicer xvfb libopengl0 libegl1 libgl1 > /dev/null
      - name: OrcaSlicer
        # The latest release's Linux AppImage, unpacked (no FUSE on the
        # runner); the Orca tests skip without it.
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api repos/OrcaSlicer/OrcaSlicer/releases/latest -q '[.assets[].name | select(endswith(".AppImage"))] | map(select(test("aarch64") | not)) | (map(select(test("2404"))) + .)[0]')
          echo "asset: $name"
          gh release download --repo OrcaSlicer/OrcaSlicer --pattern "$name" --dir "$RUNNER_TEMP/orca"
          cd "$RUNNER_TEMP/orca" && chmod +x "$name" && "./$name" --appimage-extract > /dev/null
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-0 libgstreamer-plugins-base1.0-0 > /dev/null || true
          echo "AGENTLINK_ORCASLICER=$RUNNER_TEMP/orca/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - name: Agent Link tests, with Agent Link for OrcaSlicer
        timeout-minutes: 20
        # No outer virtual screen: the slicers get one of their own when they
        # need it (slicers._run), as in the bake-off. The exit code is
        # printed, so a failure after the summary shows where it came from.
        run: |
          code=0
          python -X faulthandler -m unittest discover -s tests -v > "$RUNNER_TEMP/tests.log" 2>&1 || code=$?
          tail -n 400 "$RUNNER_TEMP/tests.log"
          echo "unittest exit code: $code"
          # Not exit: a login shell's exit runs ~/.bash_logout, whose
          # clear_console fails on the runner and turns a pass into 1.
          test "$code" -eq 0
