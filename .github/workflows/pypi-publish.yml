# SPDX-License-Identifier: LGPL-2.1-or-later
# PyPI trusted publishing for agentlink-freecad: no token is kept anywhere.
# Active (the owner chose trusted publishing, 19 Nov 2026). Before the first
# agentlink-v* tag, the owner adds a pending publisher once on
# https://pypi.org/manage/account/publishing/ : PyPI project name
# agentlink-freecad, owner jamesK1000011, repository AgentLink-FreeCAD,
# workflow pypi-publish.yml, environment pypi. Without it the publish job
# fails and nothing is uploaded; run it again after the publisher is added.
# GitHub makes the "pypi" environment at the first run; a required reviewer
# can be added there (Settings > Environments > pypi).
# It runs on an agentlink-v* tag only, so it costs no minutes otherwise.
# Guide: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: PyPI release

on:
  push:
    tags: ['agentlink-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Versions agree with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py check --tag "$TAG"
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Metadata check
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/agentlink-freecad
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
