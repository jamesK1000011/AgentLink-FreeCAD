# SPDX-License-Identifier: LGPL-2.1-or-later
version = 1

[[annotations]]
path = "agentlink/icons/*.svg"
precedence = "aggregate"
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Hand-drawn in FreeCAD's icon style (Tango palette). Compositions follow the
# Tabler Icons (MIT) and Pictogrammers MDI (Apache-2.0) glyphs named in
# agentlink/icons/CREDITS.md; no source paths were copied. Licence texts: LICENSES/.

[[annotations]]
path = ["packaging/addons.json", "packaging/pins/*", "packaging/mcpb/manifest.json"]
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# The Claude extension's manifest, add-on list and pins (JSON and bare
# commit ids, which cannot carry a comment). Moved here from ScanRuler's
# freecad-spike on 16 Nov 2026 with the launcher (packaging/mcpb/server,
# test, build.sh), all of it written for this project, and relicensed from
# AGPL-3.0-only to LGPL-2.1-or-later by its maintainer.

[[annotations]]
path = "packaging/mcpb/icon.png"
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# The Claude extension's icon: agentlink/icons/AgentLink_Workbench.svg
# rendered at 512 px.

[[annotations]]
path = ["agentlink/data/**"]
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "CC-BY-4.0"
# Data files and their schemas (LICENSE-DATA). Entries derived from others'
# work name their source in their own "source" field.

[[annotations]]
path = ["FILES", "package.xml", "scripts/live/*.json", "scripts/live/README.md", "scripts/live/ROLES.md", "docs/hardening/**", "server.json", ".gitignore", "Studio Dark/Studio Dark.cfg", "Studio Light/Studio Light.cfg", ".github/privacy/**"]
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later"
# Files that cannot carry a comment (or whose format is read as a whole):
# the file list, the Addon Manager metadata, the live window scripts, the MCP Registry entry, the theme parameter files, the
# privacy check's rule lists.

[[annotations]]
path = "scripts/ste_originals.json"
SPDX-FileCopyrightText = "Agent Link contributors"
SPDX-License-Identifier = "LGPL-2.1-or-later AND CC-BY-4.0"
# Branch explore/full-ste: main's tool descriptions before the ASD-STE100
# rewrite, for scripts/ste_check.py. The data tools' words come from
# agentlink/data/tools.json (CC-BY-4.0), the coded tools' from the code.
